version: "3.9"

services:
  server:
    image: adva1/crm-server:latest
    container_name: crm-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"

client:
  image: adva1/crm-client:latest
  container_name: crm-client
  restart: always
  depends_on:
    - server
  ports:
    - "3001:80"
  volumes:
    - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro