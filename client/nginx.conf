server {
    listen 80;
    server_name crm-adva.duckdns.org www.crm-adva.duckdns.org;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}